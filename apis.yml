name: Growth Networks
description: Growth Networks was a networking-silicon startup founded in the late 1990s that developed
  a new category of switching hardware it branded Internet Switching Fabrics — scalable, multi-service
  capacity silicon for high-speed network switches and routers. Backed by Lightspeed Venture Partners
  (co-founded by Barry Eggers), the company was acquired by Cisco Systems in 2000 and folded into Cisco's
  core routing and switching business. It operates no independent developer platform or public API today;
  this profile is retained as a venture-portfolio historical record rather than an active API provider.
